spring:
  application:
    name: payops360
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payops360}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: payops-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # Settlement files are streamed to disk above the threshold, never held in memory.
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 256KB

server:
  port: ${PAYOPS_PORT:8417}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.payops: INFO
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

payops:
  app:
    # Public URL of the web console. Links in e-mails (reset, invitation, verification) point here.
    base-url: ${APP_BASE_URL:http://localhost:3417}
  onboarding:
    # Public organisation sign-up. Off unless explicitly enabled.
    self-signup-enabled: ${PAYOPS_SELF_SIGNUP:false}
    new-organization-mfa-required: true
    # Per-IP budget for forgot/reset password, invitation acceptance, sign-up and verification.
    recovery-per-ip-per-minute: 5
  mail:
    # SMTP is used when spring.mail.host is set (env SPRING_MAIL_HOST, SPRING_MAIL_PORT,
    # SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). Without it, messages are logged (content withheld).
    from: ${MAIL_FROM:PayOps360 <no-reply@payops360.io>}
    batch-size: 25
    poll-interval: PT10S
  notifications:
    # Delivery outbox for Slack / Teams / webhook / PagerDuty / e-mail channels.
    batch-size: 50
    poll-interval: PT10S
    escalation-interval: PT1M
    connect-timeout: PT5S
    read-timeout: PT10S
    # Plain-http / private-network webhook targets. Defaults to true only in the dev profile.
    # allow-insecure-targets: false
  incidents:
    sla-check-interval: PT1M
  security:
    jwt:
      # 256-bit+ secret, base64 encoded. Mandatory outside the dev profile.
      secret: ${JWT_SECRET:}
      issuer: payops360
      access-token-ttl: 15m
      mfa-token-ttl: 5m
    refresh-token-ttl: 12h
    # AES-256 key (base64) protecting MFA secrets at rest. Mandatory outside dev.
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    cookie-secure: true
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3417}
    lockout:
      max-failed-attempts: 5
      lock-duration: 15m
      # Credential-stuffing guard: failed logins from one IP in 15 minutes.
      max-ip-failures-per15-minutes: 30
    rate-limit:
      login-per-ip-per-minute: 10
      api-per-user-per-minute: 600
    password:
      min-length: 12
      history-depth: 5
      max-age-days: 90
  ai:
    # Claude is used when an API key is present; otherwise the built-in
    # deterministic engine answers so every AI feature still works offline.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${PAYOPS_AI_MODEL:claude-opus-5-5}
    max-tokens: 16000
    timeout: 90s
  operations:
    stuck-thresholds:
      AUTHORIZED: 10m
      CAPTURED: 10m
      PROCESSING: 5m
      RETRY_PENDING: 30m
    health-window: 15m
    retention-days: 365
  reconciliation:
    # Settlement amount may differ from the ledger by at most this much (same currency) and still match.
    amount-tolerance: 0.01
    # Fuzzy match window: a line settled at T matches payments created in [T - window, T].
    fuzzy-window: P3D
    # Succeeded payments not seen in any settlement after this long become MISSING_IN_SETTLEMENT.
    missing-after: P2D
    # Settlement fee may exceed the expected fee by this much before it is flagged FEE_OVERCHARGE.
    fee-tolerance: 0.05
    # A batch with at least this many exceptions emits RECONCILIATION_EXCEPTIONS for notification routing.
    exception-alert-threshold: 5
    max-lines-per-file: 200000
    sweep-interval: PT5M
  simulator:
    enabled: false
    payments-per-minute: 40
